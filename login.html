<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Pesona Mamasa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-teal sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">⛰️ Pesona Mamasa</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="destination.html">Destinasi</a></li>
          <li class="nav-item"><a class="nav-link" href="tentang.html">Tentang</a></li>
          <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow">
          <div class="card-body p-4">
            <h2 class="text-center mb-4">Login</h2>

            <div id="pesan"></div>

            <form id="formLogin" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="nama@email.com">
                <div class="invalid-feedback" id="errEmail"></div>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Minimal 8 karakter">
                <div class="invalid-feedback" id="errPassword"></div>
              </div>
              <button type="submit" class="btn btn-teal w-100">Masuk</button>
            </form>
            <p class="text-muted small mt-3 mb-0">Catatan: validasi dilakukan di sisi browser saja (tanpa backend).</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white-50 text-center py-3 mt-5">
    <small>&copy; 2026 Pesona Mamasa - Tugas UTS Pemrograman Web</small>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
